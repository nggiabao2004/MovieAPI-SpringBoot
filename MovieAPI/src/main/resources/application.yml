spring:
  application:
    name: MovieAPI

  datasource:
    url: jdbc:mysql://localhost:3306/movie_api_db?useSSL=false&serverTimezone=UTC
    username: root
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8080

project:
    poster: posters/

base:
  url: "http://localhost:8080"